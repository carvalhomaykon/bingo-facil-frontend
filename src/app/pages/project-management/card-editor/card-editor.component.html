<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto">
    
    <div class="bg-white rounded-t-xl shadow-md p-4 flex flex-wrap gap-4 items-center justify-between border-b border-gray-200">
      <div class="flex gap-2">
        <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2">
          <span>📁 Importar Imagem</span>
          <input type="file" class="hidden" (change)="onLoadTemplate($event)" accept="image/*">
        </label>
      </div>

      <div class="flex gap-2">
        <button (click)="clearCanvas()" class="text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg font-medium transition-colors">
          Limpar
        </button>
        <button (click)="saveLayout()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-transform active:scale-95">
          💾 Salvar Template
        </button>
      </div>
    </div>

    <div class="bg-white rounded-b-xl shadow-2xl p-8 flex justify-center items-center overflow-auto border-x border-b border-gray-200" style="min-height: 500px;">
      <div class="relative shadow-inner bg-gray-50 p-2 rounded-lg border border-dashed border-gray-300">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <p class="text-center text-gray-500 mt-4 text-sm">
      Dica: Você pode arrastar, redimensionar e girar qualquer elemento adicionado ao template.
    </p>
  </div>
</div>
